<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Platinum Calc">
<meta name="theme-color" content="#0b1f3a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Domain Platinum Booking Calculator</title>
<style>
  :root{--bg:#f2f4f8;--card:#fff;--ink:#0b1f3a;--mute:#5b6b82;--accent:#0b6bff;--ok:#12a150;--line:#dde3ec}
  @media (prefers-color-scheme:dark){:root{--bg:#0a121f;--card:#131f33;--ink:#eef3fb;--mute:#94a3b8;--accent:#4c9aff;--ok:#3ddc84;--line:#25344d}}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom))}
  .wrap{max-width:460px;margin:0 auto;padding-top:20px}
  h1{font-size:1.3rem;margin:0 0 2px}
  .sub{color:var(--mute);font-size:.9rem;margin:0 0 18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
  label.field{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
  .area{display:flex;align-items:center;gap:8px}
  .area input{flex:1;font-size:1.6rem;font-weight:700;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);width:100%}
  .area input:focus{outline:none;border-color:var(--accent)}
  .area span{font-weight:700;color:var(--mute);font-size:1.1rem}
  .checks{display:grid;gap:10px;margin-top:16px}
  .chk{display:flex;align-items:center;justify-content:space-between;padding:14px;border:2px solid var(--line);border-radius:12px;cursor:pointer;user-select:none;font-weight:600;font-size:1.05rem}
  .chk input{position:absolute;opacity:0;pointer-events:none}
  .box{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:1.1rem;color:#fff;flex:none}
  .chk.on{border-color:var(--ok)}
  .chk.on .box{background:var(--ok);border-color:var(--ok)}
  .chk:focus-within{box-shadow:0 0 0 3px var(--accent)}
  .btns{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:16px}
  button{font:inherit;font-weight:700;font-size:1.1rem;padding:15px;border-radius:12px;border:0;cursor:pointer}
  #go{background:var(--accent);color:#fff}
  #reset{background:transparent;color:var(--mute);border:2px solid var(--line)}
  .err{color:#d93025;font-weight:600;margin:10px 0 0;min-height:1.2em;font-size:.92rem}
  .res{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
  .res div{padding:14px 4px;border-radius:12px;background:var(--bg)}
  .res b{display:block;font-size:1.9rem;line-height:1.1}
  .res small{color:var(--mute);font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:.03em}
  .break{margin-top:12px;color:var(--mute);font-size:.88rem;text-align:center}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap" id="app">
  <h1>Domain Platinum Calculator</h1>
  <p class="sub">Enter size, tick what's booked, hit Calculate.</p>

  <form class="card" id="form" novalidate>
    <label class="field" for="area">Property size</label>
    <div class="area"><input id="area" type="number" inputmode="decimal" min="0" step="any" placeholder="e.g. 550" autocomplete="off"><span>m²</span></div>

    <div class="checks">
      <label class="chk" id="c-mp"><span>MP (Matterport)</span><input type="checkbox" id="mp"><span class="box" aria-hidden="true"></span></label>
      <label class="chk" id="c-photo"><span>Photo</span><input type="checkbox" id="photo"><span class="box" aria-hidden="true"></span></label>
      <label class="chk" id="c-splat"><span>Splat</span><input type="checkbox" id="splat"><span class="box" aria-hidden="true"></span></label>
    </div>

    <div class="btns">
      <button type="button" id="reset">Reset</button>
      <button type="button" id="go" onclick="window.runCalc&&window.runCalc()">Calculate</button>
    </div>
    <noscript><p class="err">JavaScript is blocked here. Open this file in Safari or Chrome.</p></noscript>
    <p class="err" id="err" role="alert" aria-live="assertive"></p>
  </form>

  <section class="card hidden" id="out" aria-live="polite">
    <div class="res">
      <div><b id="r-min">–</b><small>Minutes booked</small></div>
      <div><b id="r-slots">–</b><small>Time slots</small></div>
      <div><b id="r-pts">–</b><small>Points</small></div>
    </div>
    <div class="break" id="break"></div>
  </section>
</div>

<script>
(function(){
  var POINTS_PER_SLOT = 0.333;

  // Same logic as the spreadsheet
  function mpMinutes(area){
    var extra = area - 135 - 45;
    var steps = extra > 0 ? Math.ceil(extra / 45) : 0;
    return 30 + steps * 15;
  }
  function slotsFor(min){ return min > 210 ? 3 : (min > 90 ? 2 : 1); }
  function calc(area, mp, photo, splat){
    var m = mp ? mpMinutes(area) : 0;
    var p = photo ? 45 : 0;
    var s = splat ? 15 : 0;
    var total = m + p + s;
    var slots = slotsFor(total);
    return {mp:m, photo:p, splat:s, total:total, slots:slots, points:slots * POINTS_PER_SLOT};
  }
  window.__calc = calc; // for testing

  var $ = function(id){ return document.getElementById(id); };
  ['mp','photo','splat'].forEach(function(k){
    var cb = $(k), lab = $('c-'+k);
    var sync = function(){ lab.classList.toggle('on', cb.checked); lab.querySelector('.box').textContent = cb.checked ? '✓' : ''; };
    cb.addEventListener('change', sync); sync();
  });

  function run(){
    var err = $('err'); err.textContent = '';
    var mp = $('mp').checked, photo = $('photo').checked, splat = $('splat').checked;
    var raw = $('area').value.trim();
    var area = parseFloat(raw);

    if (!mp && !photo && !splat){ err.textContent = 'Tick at least one service.'; $('out').classList.add('hidden'); return; }
    if (mp){
      if (raw === '' || isNaN(area) || area <= 0){ err.textContent = 'Enter the property size (m²) for MP.'; $('out').classList.add('hidden'); return; }
    } else if (raw !== '' && (isNaN(area) || area < 0)){ area = 0; }

    var r = calc(area || 0, mp, photo, splat);
    $('r-min').textContent = r.total;
    $('r-slots').textContent = r.slots;
    $('r-pts').textContent = r.points.toFixed(3);
    var parts = [];
    if (mp) parts.push('MP ' + r.mp);
    if (photo) parts.push('Photo ' + r.photo);
    if (splat) parts.push('Splat ' + r.splat);
    $('break').textContent = parts.join(' + ') + ' = ' + r.total + ' min';
    $('out').classList.remove('hidden');
    try{ $('out').scrollIntoView({behavior:'smooth', block:'nearest'}); }catch(x){}
  }
  window.runCalc = function(){
    try{ run(); }catch(x){ $('err').textContent = 'Error: ' + x.message; }
  };
  $('form').addEventListener('submit', function(e){ e.preventDefault(); window.runCalc(); });

  $('reset').addEventListener('click', function(){
    $('area').value = '';
    ['mp','photo','splat'].forEach(function(k){ $(k).checked = false; $(k).dispatchEvent(new Event('change')); });
    $('err').textContent = ''; $('out').classList.add('hidden');
  });
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
</body>
</html>
